[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynahive"
version = "0.1.0"
description = "Adaptive honeynet with coordinated LLM agents (Perception, Planner, Environment, Guidance, Review, Deception)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["dynahive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
